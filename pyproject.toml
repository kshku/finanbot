[project]
name = "finanbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kshku", email = "1211shree@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faker>=40.38.0",
    "langchain>=1.4.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
finanbot = "finanbot:main"

[project.optional-dependencies]
ollama = [
    "langchain-ollama>=1.1.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
